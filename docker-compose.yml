
services:
  postgres:
    image: postgres:16-alpine
    container_name: scholarsync-postgres
    environment:
      POSTGRES_DB: scholarsync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholarsync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
