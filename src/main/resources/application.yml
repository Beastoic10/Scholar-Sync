server:
  port: 8080

spring:
  application:
    name: scholar-sync
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scholarsync}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

analysis:
  service:
    url: ${ANALYSIS_SERVICE_URL:http://localhost:8000}

app:
  storage:
    upload-dir: ${UPLOAD_DIR:uploads/submissions}

# JWT Security Configuration
jwt:
  # Base64 encoded 256-bit key for HMAC-SHA256
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  # 24 hours in milliseconds (86400000 ms)
  expiration-ms: 86400000

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
